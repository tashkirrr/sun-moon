name: Render GIF

on:
  push:
    paths: ["sunmoon.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python sunmoon.py --gif docs/sunmoon.gif
      - name: Commit the new GIF
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/sunmoon.gif
          git diff --cached --quiet || (git commit -m "Update sunmoon.gif" && git push)
